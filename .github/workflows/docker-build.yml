name: Build and Push Qwen CustomVoice Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - voice-fixed-versions
    paths:
      - ".github/workflows/docker-build.yml"
      - "start-qwen-voice-with-tunnels.sh"
      - "versions/qwen-customvoice/**"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push customvoice-1.7b
        uses: docker/build-push-action@v6
        with:
          context: .
          file: versions/qwen-customvoice/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            manuztl/qwen-voice-tunnel:customvoice-1.7b
          cache-from: type=gha,scope=customvoice
          cache-to: type=gha,mode=max,scope=customvoice
