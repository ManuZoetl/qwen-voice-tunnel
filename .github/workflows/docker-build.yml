name: Build and Push Qwen Voice Docker Image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant to build"
        required: true
        default: "faster-customvoice"
        type: choice
        options:
          - faster-customvoice

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve selected variant
        id: variant
        shell: bash
        run: |
          case "${{ inputs.variant }}" in
            faster-customvoice)
              echo "dockerfile=versions/faster-customvoice/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "tag=faster-customvoice-1.7b" >> "$GITHUB_OUTPUT"
              echo "cache_scope=faster-customvoice" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported variant: ${{ inputs.variant }}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push selected voice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.variant.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            manuztl/qwen-voice-tunnel:${{ steps.variant.outputs.tag }}
          cache-from: type=gha,scope=${{ steps.variant.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.variant.outputs.cache_scope }}
