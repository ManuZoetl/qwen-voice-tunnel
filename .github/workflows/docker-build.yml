name: Build and Push Qwen Voice Docker Images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which image variant should be built?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - base
          - customvoice
          - voicedesign
          - faster-customvoice
  push:
    branches:
      - main
      - voice-fixed-versions
    paths:
      - ".github/workflows/docker-build.yml"
      - "start-qwen-voice-with-tunnels.sh"
      - "versions/**"
      - "Dockerfile"

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            dockerfile: versions/qwen-base/Dockerfile
            tag: base-1.7b

          - variant: customvoice
            dockerfile: versions/qwen-customvoice/Dockerfile
            tag: customvoice-1.7b

          - variant: voicedesign
            dockerfile: versions/qwen-voicedesign/Dockerfile
            tag: voicedesign-1.7b

          - variant: faster-customvoice
            dockerfile: versions/faster-customvoice/Dockerfile
            tag: faster-customvoice-1.7b

    steps:
      - name: Skip unselected variant
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant != 'all' && inputs.variant != matrix.variant }}
        run: |
          echo "Skipping ${{ matrix.variant }} because selected variant is ${{ inputs.variant }}."

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant }}
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.variant }}
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            manuztl/qwen-voice-tunnel:${{ matrix.tag }}
            manuztl/qwen-voice-tunnel:${{ matrix.variant }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
